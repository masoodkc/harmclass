[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "masoodkc-harmclass"
version = "0.1.0"
description = "按预先定义的类别归档文本，统计各类占比与典型样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "masoodkc" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://masoodkc.github.io"
Repository = "https://github.com/masoodkc/harmclass"
Issues = "https://github.com/masoodkc/harmclass/issues"

[project.scripts]
harmclass = "harmclass:main"

[tool.setuptools]
py-modules = ["harmclass"]
